<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">毕方编导思维使用路径</title>
  <desc id="desc">毕方帮助用户先判断该拍什么，再完成选题、脚本、审核、改稿和复盘。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#18181b"/>
      <stop offset="1" stop-color="#30120a"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="0.48" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95 0 0.55 0 0 0.25 0 0 0.15 0 0.05 0 0 0 0.75 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <style>
      .bg-grid { stroke: rgba(148, 163, 184, 0.12); stroke-width: 1; }
      .panel { fill: rgba(15, 23, 42, 0.78); stroke: rgba(125, 211, 252, 0.45); stroke-width: 2; rx: 8; }
      .panel-warm { fill: rgba(24, 24, 27, 0.82); stroke: rgba(251, 146, 60, 0.62); stroke-width: 2; rx: 8; }
      .title { fill: #fff7ed; font: 700 68px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .subtitle { fill: #fde68a; font: 600 28px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .h2 { fill: #e0f2fe; font: 700 31px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .body { fill: #cbd5e1; font: 500 24px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .small { fill: #94a3b8; font: 500 19px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .tag { fill: #020617; font: 700 21px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .step-num { fill: #020617; font: 800 24px Arial, sans-serif; }
      .step-title { fill: #fff7ed; font: 700 26px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .step-desc { fill: #cbd5e1; font: 500 19px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .line { stroke: rgba(251, 146, 60, 0.9); stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <g opacity="0.75">
    <path class="bg-grid" d="M0 80H1400M0 160H1400M0 240H1400M0 320H1400M0 400H1400M0 480H1400M0 560H1400M0 640H1400M0 720H1400"/>
    <path class="bg-grid" d="M100 0V760M200 0V760M300 0V760M400 0V760M500 0V760M600 0V760M700 0V760M800 0V760M900 0V760M1000 0V760M1100 0V760M1200 0V760M1300 0V760"/>
  </g>

  <circle cx="702" cy="360" r="260" fill="#fb923c" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="1120" cy="120" r="170" fill="#38bdf8" opacity="0.08"/>

  <g transform="translate(76 64)">
    <text class="title" x="0" y="70">毕方</text>
    <text class="subtitle" x="0" y="118">先判断用户为什么看，再决定今天拍什么</text>
  </g>

  <g transform="translate(78 200)">
    <rect class="panel-warm" width="500" height="360"/>
    <rect x="34" y="34" width="116" height="38" rx="6" fill="url(#fire)"/>
    <text class="tag" x="54" y="61">不是普通文案</text>
    <text class="h2" x="34" y="124">毕方先帮你拆清楚</text>
    <text class="body" x="34" y="178">用户真正想看什么</text>
    <text class="body" x="34" y="225">用户凭什么相信你</text>
    <text class="body" x="34" y="272">今天最该先拍哪 3 条</text>
    <text class="body" x="34" y="319">第一条改稿不能丢什么</text>
  </g>

  <g transform="translate(650 180)">
    <rect class="panel" width="650" height="430"/>
    <text class="h2" x="34" y="58">首次使用路径</text>

    <g transform="translate(40 100)">
      <circle cx="26" cy="26" r="26" fill="url(#fire)"/>
      <text class="step-num" x="19" y="34">1</text>
      <text class="step-title" x="70" y="22">建档</text>
      <text class="step-desc" x="70" y="54">行业、产品、目标用户、证据、成交目标</text>
    </g>

    <path class="line" d="M95 166V196"/>

    <g transform="translate(40 198)">
      <circle cx="26" cy="26" r="26" fill="url(#fire)"/>
      <text class="step-num" x="19" y="34">2</text>
      <text class="step-title" x="70" y="22">判断</text>
      <text class="step-desc" x="70" y="54">把卖点翻译成用户正在判断的问题</text>
    </g>

    <path class="line" d="M95 264V294"/>

    <g transform="translate(40 296)">
      <circle cx="26" cy="26" r="26" fill="url(#fire)"/>
      <text class="step-num" x="19" y="34">3</text>
      <text class="step-title" x="70" y="22">选题</text>
      <text class="step-desc" x="70" y="54">先拍 3 条，不先堆满脚本库</text>
    </g>

    <g transform="translate(360 100)">
      <circle cx="26" cy="26" r="26" fill="#38bdf8"/>
      <text class="step-num" x="19" y="34">4</text>
      <text class="step-title" x="70" y="22">脚本</text>
      <text class="step-desc" x="70" y="54">围绕判断题、证据和承接动作写</text>
    </g>

    <path class="line" d="M415 166V196"/>

    <g transform="translate(360 198)">
      <circle cx="26" cy="26" r="26" fill="#38bdf8"/>
      <text class="step-num" x="19" y="34">5</text>
      <text class="step-title" x="70" y="22">审核改稿</text>
      <text class="step-desc" x="70" y="54">防止客户改回卖点介绍</text>
    </g>

    <path class="line" d="M415 264V294"/>

    <g transform="translate(360 296)">
      <circle cx="26" cy="26" r="26" fill="#38bdf8"/>
      <text class="step-num" x="19" y="34">6</text>
      <text class="step-title" x="70" y="22">复盘</text>
      <text class="step-desc" x="70" y="54">用发布数据反推下一条拍什么</text>
    </g>
  </g>

  <g transform="translate(78 610)">
    <rect class="panel" width="1222" height="84"/>
    <text class="body" x="34" y="52">一句话开始：</text>
    <text class="subtitle" x="188" y="52">用 bifang-starter 帮我先判断该拍什么，先不要写完整脚本。</text>
  </g>
</svg>
